<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" viewBox="0 0 900 560"
     preserveAspectRatio="xMinYMin meet"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
     font-size="14">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="559" rx="12" fill="none" stroke="#30363d"/>

  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="17" r="5" fill="#27c93f"/>

  <text x="450" y="21" fill="#7d8590" text-anchor="middle" font-size="12">
    vinicius@github: ~$ fastfetch
  </text>

  <g fill="#58a6ff" font-weight="bold">
    <text x="28" y="65">vinicius@github</text>
    <text x="28" y="207">~ Stack</text>
    <text x="28" y="365">~ Highlights</text>
  </g>

  <text x="28" y="88" fill="#8b949e">----------------</text>

  <g fill="#39d353" font-weight="bold">
    <text x="28" y="115">Role</text>
    <text x="28" y="141">Company</text>
    <text x="28" y="167">Focus</text>
    <text x="28" y="193">Location</text>
  </g>

  <g fill="#c9d1d9">
    <text x="150" y="115">Data &amp; Platform Engineer</text>
    <text x="150" y="141">Bradesco</text>
    <text x="150" y="167">Data Infrastructure &amp; Platform Engineering</text>
    <text x="150" y="193">Brazil</text>
  </g>

  <g fill="#39d353" font-weight="bold">
    <text x="28" y="235">Lang</text>
    <text x="28" y="261">Data</text>
    <text x="28" y="287">Platform</text>
    <text x="28" y="313">Cloud</text>
    <text x="28" y="339">Tools</text>
  </g>

  <g fill="#c9d1d9">
    <text x="150" y="235">Python, SQL</text>
    <text x="150" y="261">PySpark, Databricks, Delta Lake</text>
    <text x="150" y="287">Terraform, Backstage, REST APIs</text>
    <text x="150" y="313">Azure, Key Vault, Cloud Infrastructure</text>
    <text x="150" y="339">GitHub Actions, CI/CD, FinOps</text>
  </g>

  <g fill="#39d353">
    <text x="28" y="395">•</text>
    <text x="28" y="425">•</text>
    <text x="28" y="455">•</text>
    <text x="28" y="485">•</text>
  </g>

  <g fill="#c9d1d9">
    <text x="48" y="395">168x faster resource provisioning</text>
    <text x="48" y="425">From 1 week to less than 1 hour</text>
    <text x="48" y="455">Self-service platform for data teams</text>
    <text x="48" y="485">Infrastructure automation &amp; governance</text>
  </g>

  <line x1="0" y1="530" x2="900" y2="530" stroke="#30363d"/>

  <text x="20" y="550" fill="#7d8590" font-size="13">
    vinicius@github:~$ <tspan fill="#c9d1d9">fastfetch</tspan>
  </text>

  <rect x="238" y="538" width="8" height="14" fill="#c9d1d9">
    <animate attributeName="opacity"
             values="1;1;0;0"
             keyTimes="0;0.5;0.51;1"
             dur="1s"
             repeatCount="indefinite"/>
  </rect>
